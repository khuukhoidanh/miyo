<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cùng nhìn lại hành trình giao lưu giữa Hà Nội và Cao Hùng.">
  <meta name="theme-color" content="#f1efe9">
  <title>MIYO — Những ngày thân quen</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/miyo-chat.css">
  <style>
    :root { color-scheme: light; --paper: #f1efe9; --ink: #191b1b; --muted: #777772; --accent: #a24f38; --blue: #334f60; --mono: "DM Mono", monospace; --display: "Space Grotesk", sans-serif; --sans: "DM Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; margin: 0; padding: clamp(16px, 4vw, 54px); background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1320px); }
    .banner { position: relative; display: flex; min-height: min(75vh, 720px); flex-direction: column; justify-content: space-between; overflow: hidden; padding: clamp(28px, 5vw, 68px); color: white; text-decoration: none; background: #334f60 url('https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=2200&q=85') center 48%/cover; }
    .banner::before { position:absolute; inset:0; content:""; background:linear-gradient(90deg,rgba(14,28,34,.74),rgba(14,28,34,.18) 75%),linear-gradient(0deg,rgba(14,28,34,.46),transparent 45%); }
    .banner::after { position: absolute; right: 4%; bottom: 12%; width: min(30vw, 360px); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.38); border-radius: 50%; content: ""; box-shadow: 0 0 0 28px rgba(255,255,255,.07), 0 0 0 56px rgba(255,255,255,.05); pointer-events: none; }
    .eyebrow { position:relative; z-index:1; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.86); font: 500 10px/1.5 var(--mono); letter-spacing: .14em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(162,79,56,.12); }
    h1 { position: relative; z-index: 1; max-width: 900px; margin: 50px 0 25px; font: 500 clamp(56px, 10vw, 132px)/.9 var(--display); letter-spacing: -.09em; }
    h1 em { color: #e2b5a0; font: inherit; }
    .bottom { position: relative; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .bottom p { max-width: 430px; margin: 0; color: rgba(255,255,255,.84); font-size: 14px; line-height: 1.7; }
    .open { display: flex; align-items: center; gap: 30px; font: 400 10px/1.5 var(--mono); letter-spacing: .12em; }
    .arrow { display: inline-flex; width: 20px; height: 20px; flex: 0 0 20px; color: var(--accent); transition: transform .2s; }
    .arrow svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .banner:hover .arrow { transform: translate(4px, -4px); }
    .actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 14px; }
    .button { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid rgba(25,27,27,.5); color: var(--ink); font-size: 12px; text-decoration: none; transition: background .2s, color .2s; }
    .button:hover { background: var(--ink); color: var(--paper); }
    .arrow { color: currentColor; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 600px) { body { padding: 12px; } .banner { min-height: 70svh; padding: 26px 22px; background-position: 58% center; } .banner::after { width: 48vw; right:-14%; bottom:20%; } h1 { margin: 50px 0 24px; font-size: clamp(56px, 15vw, 88px); } .bottom { align-items: flex-start; flex-direction: column; gap:22px; } .actions { justify-content: stretch; } .button { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <a class="banner" href="memories/" aria-label="Open the MIYO memories website">
      <span class="eyebrow"><span class="dot" aria-hidden="true"></span> HÀ NỘI ↔ CAO HÙNG · THÁNG 10</span>
      <h1>Những ngày<br><em>thân quen.</em></h1>
      <span class="bottom"><p>Một chuyến đi, hai ngôi trường, thật nhiều khoảnh khắc để cùng nhớ lại.</p><span class="open">XEM HÀNH TRÌNH <span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 15 15 5M7 5h8v8"/></svg></span></span></span>
    </a>
    <div class="actions"><a class="button" href="applications/">Điền thông tin tham gia&nbsp; <span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 15 15 5M7 5h8v8"/></svg></span></a></div>
  </main>
  <script src="shared/miyo-config.js"></script>
  <script src="shared/miyo-chat.js"></script>
</body>
</html>
